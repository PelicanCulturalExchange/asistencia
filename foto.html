<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foto de perfil · Pelican</title>
<style>
:root{--n2:#14222A;--n1:#1D2F39;--g1:#8FD3A8;--g3:#CFE8DC;--b3:#8FB4C8;--w:#F5F8F7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--n2);color:var(--w);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:20px}
main{width:min(420px,100%)}h1{font-size:20px;margin:0 0 4px}p{color:var(--b3);font-size:14px;margin:4px 0 16px}
.cam{width:min(300px,80vw);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;border:5px solid var(--g1);background:var(--n1)}
video,img{width:100%;height:100%;object-fit:cover;display:block}video{transform:scaleX(-1)}
.row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
button,a.b{font:inherit;font-weight:700;font-size:14px;padding:10px 20px;border-radius:999px;border:1.5px solid rgba(143,211,168,.45);background:transparent;color:var(--g3);cursor:pointer;text-decoration:none}
button.p{background:var(--g1);border-color:var(--g1);color:var(--n2)}.hide{display:none}#msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--b3)}
</style></head><body><main>
<h1>Foto de perfil</h1><p>Mira a la cámara y sonríe 🙂</p>
<div class="cam"><video id="v" autoplay playsinline muted></video><img id="s" class="hide" alt=""></div>
<div class="row" id="r1"><button class="p" id="snap">Tomar foto</button></div>
<div class="row hide" id="r2"><button id="again">Repetir</button><button class="p" id="use">Usar esta foto</button></div>
<div id="msg"></div>
<script>
var v=document.getElementById('v'),s=document.getElementById('s'),r1=document.getElementById('r1'),r2=document.getElementById('r2'),msg=document.getElementById('msg'),stream=null,data='';
function show(on){v.classList.toggle('hide',!on);s.classList.toggle('hide',on);r1.classList.toggle('hide',!on);r2.classList.toggle('hide',on)}
function start(){navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false}).then(function(st){stream=st;v.srcObject=st;show(true);msg.textContent=''}).catch(function(){msg.textContent='No pude abrir la cámara. Permite el acceso a la cámara en el navegador y vuelve a intentar.'})}
document.getElementById('snap').onclick=function(){if(!v.videoWidth)return;var m=Math.min(v.videoWidth,v.videoHeight),c=document.createElement('canvas');c.width=c.height=Math.min(720,m);var x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,(v.videoWidth-m)/2,(v.videoHeight-m)/2,m,m,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',.85);s.src=data;show(false)};
document.getElementById('again').onclick=function(){show(true)};
document.getElementById('use').onclick=function(){
  if(window.opener&&!window.opener.closed){window.opener.postMessage({pelicanFoto:data},'*');if(stream)stream.getTracks().forEach(function(t){t.stop()});window.close();msg.textContent='Listo, ya puedes cerrar esta ventana.'}
  else{var a=document.createElement('a');a.href=data;a.download='foto-perfil.jpg';a.click();msg.textContent='Se descargó la foto: súbela con "Subir archivo" en el panel.'}};
start();
</script></main></body></html>
